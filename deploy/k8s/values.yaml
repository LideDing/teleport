# Teleport v18.11.1 (OSS, self-built image) + Tencent COS as binary CDN
#
# Chart: teleport/teleport-cluster 18.11.1 (official repo)
# Usage: ./deploy.sh install
#
# 修改点只有三个：
#   1. clusterName / image / TELEPORT_CDN_BASE_URL
#   2. 私有镜像仓库的拉取凭据（deploy.sh 会自动创建 teleport-registry）
#   3. 如不用 cert-manager，改成 acme: true 或 tls.existingSecretName

# 对外访问域名。必须解析到 Proxy 的 LoadBalancer IP，证书也要覆盖它。
clusterName: teleport-agpl.ap-singapore.oitcep.com

# standalone: auth + proxy 在一个进程里，数据写 PVC（单副本）
chartMode: standalone
# separate: 443 只做 Web/客户端，节点反向隧道走 3024（chart 默认，已验证可用）
proxyListenerMode: separate
enterprise: false
# cert-manager 负责签发证书，不用内建 ACME
acme: false

# ---------------------------------------------------------------------------
# 镜像：自编译的 v18.11.1 OSS 版本
# ---------------------------------------------------------------------------
image: oitcep-tcr.tencentcloudcr.com/oitcep/teleport
# chart 用它拼 image:tag；镜像 tag 不是 chart 默认的 18.11.1，所以必须显式指定
teleportVersionOverride: v18.11.1-agpl
imagePullPolicy: IfNotPresent
imagePullSecrets:
  - name: teleport-registry

# K8s 集群在 Teleport UI 里的名字
kubeClusterName: cls-g8ta0gnm

# ---------------------------------------------------------------------------
# 二进制分发地址：Proxy 生成安装脚本时用它，Agent 的 teleport-update 从这里下载
#   <base>/teleport-v18.11.1-linux-amd64-bin.tar.gz{,.sha256,.sig}
# OSS 构建不带这个变量时 /scripts/install.sh 会直接报 AGPL/Community 错误。
# ---------------------------------------------------------------------------
extraEnv:
  - name: TELEPORT_CDN_BASE_URL
    # TODO: 换成你 COS 桶的 HTTPS 访问域名（不要带结尾斜杠）
    value: "https://teleport-agpl.cos.oitcep.com"

# ---------------------------------------------------------------------------
# 认证
# ---------------------------------------------------------------------------
authentication:
  type: local
  localAuth: true
  secondFactors:
    - otp
    - webauthn

# ---------------------------------------------------------------------------
# 高可用 / 证书
# ---------------------------------------------------------------------------
highAvailability:
  # standalone 模式下 auth 只能单副本（多副本需要 etcd/DynamoDB）
  replicaCount: 1
  certManager:
    enabled: true
    issuerKind: ClusterIssuer
    issuerName: letsencrypt-dns

proxy:
  highAvailability:
    replicaCount: 1
  annotations:
    service:
      # external-dns 会自动把该域名指向 CLB
      # 主域名 + 泛域名（App Access 的 app.<域名> 需要泛解析）
      external-dns.alpha.kubernetes.io/hostname: "teleport-agpl.ap-singapore.oitcep.com,*.teleport-agpl.ap-singapore.oitcep.com"
      external-dns.alpha.kubernetes.io/ttl: "600"
      # TKE 默认把 443 建成七层 HTTP(S) 监听器，这里强制成四层 TCP，
      # 否则 Teleport 自己终止 TLS 的流量会被 CLB 当成 HTTP 解析并返回 502
      service.cloud.tencent.com/specify-protocol: '{"443":{"protocol":["TCP"]}}'
      # CLB 直连 Pod IP：不走 nodePort/kube-proxy。实测 nodePort 路径约 40% SYN 超时，
      # 直连后 20/20 成功。这个注解必须保留，否则节点安装会随机失败。
      service.cloud.tencent.com/direct-access: "true"
      service.cloud.tencent.com/security-groups: "sg-8dvjw3uc" # 绑定安全组，需确保放通 443 入站
  teleportConfig:
    proxy_service:
      # 证书轮换后避免必须重启
      https_keypairs_reload_interval: 1h
      trust_x_forwarded_for: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

auth:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

# ---------------------------------------------------------------------------
# 入口与存储
# ---------------------------------------------------------------------------
service:
  type: LoadBalancer
  # Cluster：CLB 健康检查打到所有节点都能通过；Local 只对运行 Proxy 的节点生效，
  # 在单副本场景下容易让 CLB 判定后端不可用（表现为外部访问超时/502）
  spec:
    externalTrafficPolicy: Cluster

persistence:
  enabled: true
  # 该集群只有默认的 cbs StorageClass
  storageClassName: cbs
  volumeSize: 20Gi

log:
  level: INFO
  format: json

operator:
  enabled: false

# 镜像里的 teleport 以非 root 运行（distroless nonroot = 65532）
securityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
